name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Core tests (also regenerates the TypeScript bindings)
        run: pnpm bindings && cargo test -p refine-core
      - name: Bindings are committed and current
        run: git diff --exit-code src/bindings
      - run: cargo clippy -p refine-core --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: pnpm test

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: refine-${{ matrix.platform == 'macos-latest' && 'macos' || 'windows' }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # On a version tag (v0.1.0, ...): publish the installers as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: find installers -type f
      # Fixed-name copies, so github.com/.../releases/latest/download/<name> always works.
      - name: Add fixed-name copies
        run: |
          mkdir -p installers/latest
          cp "$(find installers -name '*_universal.dmg' | head -1)" installers/latest/Refine-macOS.dmg
          cp "$(find installers -name '*-setup.exe' | head -1)" installers/latest/Refine-Windows-setup.exe
          cp "$(find installers -name '*.msi' | head -1)" installers/latest/Refine-Windows.msi
          ls -la installers/latest
      - uses: softprops/action-gh-release@v2
        with:
          name: Refine ${{ github.ref_name }}
          # Draft first, published below once every file is attached, so latest/download/<name>
          # never points at a release that's still missing its files.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*.exe
          body: |
            ## Download

            - **macOS** (Apple Silicon and Intel): `Refine-macOS.dmg`
            - **Windows**: `Refine-Windows-setup.exe` (or `Refine-Windows.msi`)

            Refine is beta software: it may not work, may crash, and could harm your computer or lose your data.
            It comes as is, with no warranty, and you use it at your own risk.

            Refine isn't registered with Apple or Microsoft yet, so your computer will warn you the first time:
            - **macOS:** open the `.dmg`, drag Refine into Applications and open it. When macOS says it can't check
              the app, go to System Settings → Privacy & Security and click **Open Anyway**.
            - **Windows:** if you see "Windows protected your PC", choose **More info**, then **Run anyway**.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
